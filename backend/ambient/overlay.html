<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  .overlay {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 15vh;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .search-container {
    width: 640px;
    max-width: 90vw;
    background: rgba(30,30,40,0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.6);
    overflow: hidden;
    transition: all 0.2s ease;
  }
  .search-bar {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .search-bar .icon {
    width: 24px; height: 24px;
    margin-right: 12px;
    color: #8888ff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 18px;
    font-family: inherit;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.3); }
  .search-bar .badge {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    padding: 4px 8px;
    border-radius: 6px;
    margin-left: 8px;
  }
  .results { max-height: 420px; overflow-y: auto; padding: 4px 0; }
  .results::-webkit-scrollbar { width: 4px; }
  .results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  .result-item {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.1s;
    color: rgba(255,255,255,0.7);
  }
  .result-item:hover, .result-item.selected {
    background: rgba(136,136,255,0.12);
    color: #fff;
  }
  .result-item .label { flex: 1; font-size: 14px; }
  .result-item .desc { font-size: 11px; color: rgba(255,255,255,0.3); margin-left: 12px; }
  .result-item .action-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    margin-left: 8px;
  }
  .result-item .shortcut {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
    min-width: 20px;
    text-align: center;
  }
  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: rgba(255,255,255,0.25);
    font-size: 13px;
  }
  .hints {
    display: flex;
    gap: 12px;
    padding: 10px 20px;
    border-top: 1px solid rgba(255,255,255,0.04);
    font-size: 11px;
    color: rgba(255,255,255,0.2);
  }
  .hints span { display: flex; align-items: center; gap: 4px; }
  .hints kbd {
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.online { background: #44ff88; }
  .status-dot.offline { background: #ff4444; }
  .status-dot.listening { background: #ffaa44; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="search-container">
    <div class="search-bar">
      <div class="icon">&#9670;</div>
      <input type="text" id="searchInput" placeholder="Ask JARVIS anything..." autofocus spellcheck="false">
      <span class="badge" id="statusBadge"><span class="status-dot online" id="statusDot"></span>Online</span>
    </div>
    <div class="results" id="results">
      <div class="empty-state">Type a command or question to get started</div>
    </div>
    <div class="hints">
      <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> Navigate</span>
      <span><kbd>&#9166;</kbd> Execute</span>
      <span><kbd>Esc</kbd> Close</span>
      <span><kbd>&#8997;+&#8679;+J</kbd> Toggle</span>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('searchInput');
const results = document.getElementById('results');
const statusBadge = document.getElementById('statusBadge');
const statusDot = document.getElementById('statusDot');
let ws = null;
let selectedIndex = -1;
let currentResults = [];
let debounceTimer = null;

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ambient/ws`);

  ws.onopen = () => {
    statusDot.className = 'status-dot online';
    statusBadge.innerHTML = '<span class="status-dot online"></span>Online';
  };

  ws.onclose = () => {
    statusDot.className = 'status-dot offline';
    statusBadge.innerHTML = '<span class="status-dot offline"></span>Offline';
    setTimeout(connect, 2000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'results') {
      currentResults = msg.results || [];
      renderResults(currentResults);
    } else if (msg.type === 'executing') {
      renderExecuting(msg.command);
    } else if (msg.type === 'result') {
      renderResult(msg.result);
    } else if (msg.type === 'voice') {
      statusDot.className = 'status-dot listening';
      statusBadge.innerHTML = '<span class="status-dot listening"></span>Listening...';
    }
  };
}

function renderResults(items) {
  selectedIndex = -1;
  if (!items || items.length === 0) {
    results.innerHTML = '<div class="empty-state">No results found</div>';
    return;
  }
  results.innerHTML = items.map((item, i) => `
    <div class="result-item" data-index="${i}" onclick="selectItem(${i})">
      <span class="label">${escapeHtml(item.label)}</span>
      ${item.description ? `<span class="desc">${escapeHtml(item.description)}</span>` : ''}
      <span class="action-badge">${item.action || 'run'}</span>
    </div>
  `).join('');
}

function renderExecuting(command) {
  results.innerHTML = `
    <div class="result-item" style="opacity:0.6; cursor:default;">
      <span class="label">Executing: ${escapeHtml(command)}</span>
      <span class="desc" style="color:#8888ff;">...</span>
    </div>
  `;
}

function renderResult(result) {
  const output = result?.output || result?.error || 'Done';
  results.innerHTML = `
    <div class="result-item" style="cursor:default; flex-direction:column; align-items:flex-start; gap:8px;">
      <span class="label" style="color:#44ff88; font-weight:600;">&#10003; Complete</span>
      <span class="desc" style="font-size:13px; white-space:pre-wrap; max-height:200px; overflow-y:auto;">${escapeHtml(output)}</span>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function selectItem(index) {
  const items = results.querySelectorAll('.result-item');
  items.forEach((el, i) => el.classList.toggle('selected', i === index));
  selectedIndex = index;
}

function executeSelected() {
  const query = input.value.trim();
  if (!query) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'execute', command: query }));
  }
}

input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const query = input.value.trim();
  if (!query) {
    results.innerHTML = '<div class="empty-state">Type a command or question to get started</div>';
    return;
  }
  debounceTimer = setTimeout(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: 'query', query }));
    }
  }, 200);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    executeSelected();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    const items = results.querySelectorAll('.result-item');
    const next = Math.min(selectedIndex + 1, items.length - 1);
    if (next >= 0) selectItem(next);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(selectedIndex - 1, 0);
    selectItem(prev);
  } else if (e.key === 'Escape') {
    window.close();
  }
});

document.addEventListener('click', (e) => {
  if (e.target === document.getElementById('overlay')) {
    window.close();
  }
});

connect();
input.focus();
</script>
</body>
</html>
