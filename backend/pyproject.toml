[tool.ruff]
target-version = "py312"
line-length = 120
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "N802",   # function name should be lowercase (some existing APIs)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "UP007",  # use X | Y for union types (keep str | None compatible)
]

[tool.ruff.per-file-ignores]
"backend/actions.py" = ["E", "W", "F", "N"]  # Legacy file, too many violations to fix at once
"backend/main.py" = ["E501", "B008"]  # Large file with many route definitions

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relax for now — many existing functions lack types
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "groq.*",
    "livekit.*",
    "kokoro_onnx.*",
    "edge_tts.*",
    "duckduckgo_search.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true
