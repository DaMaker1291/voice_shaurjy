name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow

      - name: Build Frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Install Electron deps
        working-directory: desktop
        run: npm install

      - name: Generate icons
        working-directory: desktop
        run: python generate_icons.py

      - name: Build Electron (Windows)
        working-directory: desktop
        run: npm exec -- electron-builder --win --x64 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-log
          path: desktop/build.log

      - name: Zip Windows build
        if: success()
        shell: bash
        run: cd desktop/dist && 7z a -tzip "../../JARVIS-Windows-x64.zip" "win-unpacked/"

      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: JARVIS-Windows-x64.zip
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow

      - name: Build Frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Install Electron deps
        working-directory: desktop
        run: npm install

      - name: Generate icons
        working-directory: desktop
        run: python3 generate_icons.py

      - name: Build Electron (macOS)
        working-directory: desktop
        run: npm exec -- electron-builder --mac 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-log
          path: desktop/build.log

      - name: Upload macOS artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow

      - name: Build Frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Install Electron deps
        working-directory: desktop
        run: npm install

      - name: Generate icons
        working-directory: desktop
        run: python3 generate_icons.py

      - name: Build Electron (Linux)
        working-directory: desktop
        run: npm exec -- electron-builder --linux 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-log
          path: desktop/build.log

      - name: Upload Linux artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 30

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Uploading artifacts for tag: $TAG"
          for f in artifacts/windows-build/*.exe artifacts/mac-build/*.dmg artifacts/mac-build/*.zip artifacts/linux-build/*.AppImage artifacts/linux-build/*.deb; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "$TAG" "$f" --clobber || echo "Upload failed for $f (release may not exist yet)"
            fi
          done
