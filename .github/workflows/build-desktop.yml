name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow

      - name: Build Frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Install Electron deps
        working-directory: desktop
        run: npm install

      - name: Generate icons
        working-directory: desktop
        run: python generate_icons.py

      - name: Debug info
        working-directory: desktop
        run: |
          echo "=== node_modules/.bin ==="
          ls node_modules/.bin/electron* 2>/dev/null || echo "no electron binaries"
          echo "=== frontend/out ==="
          ls ../frontend/out/ 2>/dev/null | head -5 || echo "MISSING"
          echo "=== backend ==="
          ls ../backend/*.py 2>/dev/null | head -5 || echo "MISSING"

      - name: Build Electron (Windows)
        working-directory: desktop
        run: npx electron-builder --win --x64 --log verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            desktop/dist/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow

      - name: Build Frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Install Electron deps
        working-directory: desktop
        run: npm install

      - name: Generate icons
        working-directory: desktop
        run: python3 generate_icons.py

      - name: Build Electron (macOS)
        working-directory: desktop
        run: npx electron-builder --mac --log verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow

      - name: Build Frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Install Electron deps
        working-directory: desktop
        run: npm install

      - name: Generate icons
        working-directory: desktop
        run: python3 generate_icons.py

      - name: Build Electron (Linux)
        working-directory: desktop
        run: npx electron-builder --linux --log verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 30

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/*.exe
            artifacts/mac-build/*.dmg
            artifacts/mac-build/*.zip
            artifacts/linux-build/*.AppImage
            artifacts/linux-build/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
