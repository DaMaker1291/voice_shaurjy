<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#00FF66;--cyan:#06B6D4;--crimson:#EF4444;--bg:rgba(3,7,18,0.88);--border:rgba(255,255,255,0.05);--text:#F8FAFC;--text-dim:rgba(248,250,252,0.35);--text-muted:rgba(248,250,252,0.12);--mono:'Cascadia Code','Fira Code','JetBrains Mono',monospace}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:transparent;overflow:hidden;user-select:none}
.overlay{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8vh}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.container{width:640px;max-width:90vw;background:var(--bg);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:20px;box-shadow:0 32px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.01),inset 0 1px 0 rgba(255,255,255,0.03);animation:slideDown 0.2s cubic-bezier(0.16,1,0.3,1);overflow:hidden}
.bar{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px}
.bar .icon svg{width:18px;height:18px;display:block}
.bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit;letter-spacing:0.005em}
.bar input::placeholder{color:rgba(248,250,252,0.12)}
.badge{font-size:8px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.02);color:var(--text-dim);letter-spacing:0.05em;display:flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid rgba(255,255,255,0.02);font-family:var(--mono)}
.status-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.status-dot.online{background:var(--green);box-shadow:0 0 8px rgba(0,255,102,0.4)}
.status-dot.offline{background:var(--crimson)}
.suggestions{display:flex;gap:4px;padding:8px 20px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.chip{font-size:10px;padding:4px 11px;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-dim);cursor:pointer;transition:all 0.12s;border:1px solid rgba(255,255,255,0.03);font-family:var(--mono)}
.chip:hover{background:rgba(0,255,102,0.06);color:var(--green);border-color:rgba(0,255,102,0.1)}
.chip.system{border-color:rgba(6,182,212,0.08);color:rgba(6,182,212,0.4)}
.chip.system:hover{background:rgba(6,182,212,0.06);color:var(--cyan);border-color:rgba(6,182,212,0.12)}
.chip.device{border-color:rgba(255,179,0,0.08);color:rgba(255,179,0,0.4)}
.chip.device:hover{background:rgba(255,179,0,0.06);color:#FFB300;border-color:rgba(255,179,0,0.12)}
.results{max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.03) transparent}
.results::-webkit-scrollbar{width:3px}
.results::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.04);border-radius:4px}
.result-item{display:flex;align-items:center;padding:9px 20px;cursor:pointer;transition:all 0.08s;color:var(--text-dim);border-left:2px solid transparent}
.result-item:hover,.result-item.selected{background:rgba(0,255,102,0.03);color:var(--text);border-left-color:var(--green)}
.result-item .label{flex:1;font-size:13px}
.result-item .desc{font-size:10px;color:var(--text-muted);margin:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.result-item .action-badge{font-size:7px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase;font-family:var(--mono)}
.empty-state{padding:32px 20px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.6}
.empty-state .keys{margin-top:12px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.empty-state .keys span{background:rgba(255,255,255,0.02);padding:2px 8px;border-radius:5px;font-size:9px;color:rgba(248,250,252,0.08);font-family:var(--mono)}
.hints{display:flex;gap:12px;padding:7px 20px;border-top:1px solid var(--border);font-size:8px;color:var(--text-muted);font-family:var(--mono)}
.hints span{display:flex;align-items:center;gap:3px}
.hints kbd{background:rgba(255,255,255,0.02);padding:1px 4px;border-radius:3px;font-size:7px;min-width:12px;text-align:center}
.screen-toggle{cursor:pointer;margin-left:auto;transition:color 0.2s;display:flex;align-items:center;gap:3px}
.screen-toggle:hover{color:var(--green)!important}
.clarify-input{width:100%;background:rgba(3,7,18,0.6);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.clarify-input:focus{border-color:rgba(0,255,102,0.15)}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="container">
    <div class="bar">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00FF66" stroke-width="1.4">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <input type="text" id="searchInput" placeholder="Ask JARVIS anything..." autofocus spellcheck="false">
      <span class="badge" id="statusBadge"><span class="status-dot online" id="statusDot"></span>ONLINE</span>
    </div>
    <div class="suggestions" id="suggestions">
      <span class="chip" data-q="hi">Hi</span>
      <span class="chip" data-q="system status">Status</span>
      <span class="chip system" data-q="open chrome">Chrome</span>
      <span class="chip device" data-q="turn on lights">Lights</span>
      <span class="chip" data-q="search AI news">News</span>
      <span class="chip" data-q="screenshot">Screen</span>
    </div>
    <div class="results" id="results">
      <div class="empty-state">
        Type a command or question<br>
        <div class="keys"><span>↑ ↓ Navigate</span><span>↵ Execute</span><span>Esc Close</span></div>
      </div>
    </div>
    <div class="hints">
      <span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Run</span>
      <span><kbd>Esc</kbd> Close</span>
      <span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>J</kbd> Toggle</span>
      <span class="screen-toggle" id="screenToggle" onclick="toggleScreenPreview()">● Screen</span>
    </div>
  </div>
</div>
<script>
const input = document.getElementById('searchInput');
const results = document.getElementById('results');
const statusBadge = document.getElementById('statusBadge');
const statusDot = document.getElementById('statusDot');
const suggestions = document.getElementById('suggestions');
let selectedIndex = -1;
let currentResults = [];
let backendUrl = 'http://127.0.0.1:8000';
let pendingGoal = null;
let pendingAnswers = {};

window.addEventListener('focus', () => setTimeout(() => input?.focus(), 50));
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(() => input?.focus(), 50); });

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const q = chip.dataset.q;
    input.value = q;
    executeCommand(q);
    input.focus();
  });
});

let debounceTimer = null;
input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = input.value.trim();
  if (!q) { showEmptyState(); return; }
  debounceTimer = setTimeout(() => doSearch(q), 150);
});

async function doSearch(query) {
  try {
    const res = await fetch(`${backendUrl}/ambient/overlay-search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    currentResults = data.results || [];
    renderResults(currentResults);
  } catch {
    currentResults = [{ label: query, description: 'Enter to execute', action: 'run' }];
    renderResults(currentResults);
  }
}

function renderResults(items) {
  selectedIndex = -1;
  suggestions.style.display = 'none';
  if (!items || items.length === 0) {
    results.innerHTML = '<div class="empty-state">No results</div>';
    return;
  }
  results.innerHTML = items.map((item, i) => `
    <div class="result-item" data-index="${i}" onclick="executeItem(${i})">
      <span class="label">${esc(item.label)}</span>
      ${item.description ? `<span class="desc">${esc(item.description)}</span>` : ''}
      <span class="action-badge">${item.action || 'run'}</span>
    </div>
  `).join('');
  selectItem(0);
}

function showEmptyState() {
  suggestions.style.display = 'flex';
  results.innerHTML = '<div class="empty-state">Type a command or question<br><div class="keys"><span>↑ ↓ Navigate</span><span>Enter Execute</span><span>Esc Close</span></div></div>';
}

function selectItem(index) {
  const items = results.querySelectorAll('.result-item');
  items.forEach((el, i) => el.classList.toggle('selected', i === index));
  selectedIndex = index;
  if (items[index]) items[index].scrollIntoView({ block: 'nearest' });
}

function executeItem(index) {
  const items = results.querySelectorAll('.result-item');
  if (items[index]) {
    const command = items[index].querySelector('.label').textContent;
    executeCommand(command);
  }
}

async function executeCommand(command) {
  results.innerHTML = '<div class="result-item" style="cursor:default;justify-content:center;padding:20px;color:var(--text-dim);font-size:12px;"><span>● Executing...</span></div>';
  try {
    const body = { goal: command, safety: 'confirm_destructive', stream: false };
    if (pendingGoal === command && Object.keys(pendingAnswers).length > 0) {
      body.answers = pendingAnswers;
    }
    const res = await fetch(`${backendUrl}/api/do-anything`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.action === 'clarify' && data.questions) { renderClarification(data, command); return; }
      pendingGoal = null; pendingAnswers = {};
      renderResult(data, command); return;
    }
  } catch {}
  pendingGoal = null; pendingAnswers = {};
  if (window.jarvis?.executeOverlay) { window.jarvis.executeOverlay(command); }
  else if (window.jarvis?.hideOverlay) { window.jarvis.hideOverlay(); }
  else { renderResult({ success: true, output: 'Sent: "' + command + '"' }, command); }
}

function renderClarification(data, command) {
  pendingGoal = command;
  const questions = data.questions || [];
  const qHtml = questions.map((q, i) => `
    <div style="margin-bottom:8px;">
      <div style="color:#FFB300;font-size:12px;margin-bottom:4px;">${esc(q)}</div>
      <input type="text" id="answer_${i}" class="clarify-input" placeholder="Your answer..." autocomplete="off">
    </div>
  `).join('');
  results.innerHTML = `
    <div class="result-item" style="cursor:default;flex-direction:column;align-items:stretch;gap:4px;padding:16px 20px;">
      <div style="color:#FFB300;font-weight:500;font-size:13px;margin-bottom:6px;">I need more details:</div>
      ${qHtml}
      <div style="display:flex;gap:6px;margin-top:4px;">
        <button onclick="submitAnswers()" style="flex:1;background:var(--green);color:#030712;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-family:inherit;font-size:11px;">Submit</button>
        <button onclick="cancelClarification()" style="background:rgba(255,255,255,0.02);color:var(--text-dim);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:11px;">Cancel</button>
      </div>
    </div>`;
  setTimeout(() => { const f = document.getElementById('answer_0'); if (f) f.focus(); }, 50);
}

function submitAnswers() {
  const inputs = results.querySelectorAll('.clarify-input');
  const answers = {};
  inputs.forEach((inp, i) => { if (inp.value.trim()) answers['answer_' + i] = inp.value.trim(); });
  pendingAnswers = answers;
  if (pendingGoal) { input.value = pendingGoal; executeCommand(pendingGoal); }
}

function cancelClarification() { pendingGoal = null; pendingAnswers = {}; showEmptyState(); }

function renderResult(data, command) {
  const steps = data.steps || [];
  const stepHtml = steps.map(s =>
    '<div style="display:flex;gap:8px;font-size:11px;padding:2px 0;"><span style="color:' + (s.status === 'done' ? 'var(--green)' : s.status === 'failed' ? '#EF4444' : '#667085') + ';min-width:50px;flex-shrink:0;">' + s.status + '</span><span style="color:var(--text-dim)">' + esc(s.description || s.action) + '</span></div>'
  ).join('');
  const output = data.output || data.result || '';
  const outputHtml = output ? '<div style="font-size:10px;color:var(--text-dim);padding:8px 12px;background:rgba(3,7,18,0.4);border-radius:6px;margin-top:6px;line-height:1.4;max-height:100px;overflow-y:auto;font-family:var(--mono)">' + esc(output) + '</div>' : '';
  results.innerHTML = `
    <div class="result-item" style="cursor:default;flex-direction:column;align-items:stretch;gap:4px;padding:14px 20px;">
      <div style="display:flex;align-items:center;gap:8px;width:100%;">
        <span style="color:${data.success !== false ? 'var(--green)' : '#EF4444'};font-weight:500;font-size:13px;">
          ${data.success !== false ? 'Done' : 'Failed'}
        </span>
        <span style="font-size:9px;color:var(--text-dim);margin-left:auto;font-family:var(--mono);">
          ${data.duration_seconds ? data.duration_seconds + 's' : ''}
          ${steps.length ? '· ' + steps.length + ' steps' : ''}
        </span>
      </div>
      ${stepHtml ? '<div style="margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.02);">' + stepHtml + '</div>' : ''}
      ${outputHtml}
      ${data.error ? '<div style="color:#EF4444;font-size:11px;padding-top:4px;">' + esc(data.error) + '</div>' : ''}
    </div>`;
}

function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

input.addEventListener('keydown', (e) => {
  const items = results.querySelectorAll('.result-item');
  if (e.key === 'Enter') {
    e.preventDefault(); const q = input.value.trim();
    if (selectedIndex >= 0 && items[selectedIndex]) executeItem(selectedIndex);
    else if (q) executeCommand(q);
  } else if (e.key === 'ArrowDown') { e.preventDefault(); selectItem(Math.min(selectedIndex + 1, items.length - 1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectItem(Math.max(selectedIndex - 1, 0)); }
  else if (e.key === 'Escape') { if (pendingGoal) { cancelClarification(); return; } if (window.jarvis?.hideOverlay) window.jarvis.hideOverlay(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.classList.contains('clarify-input')) {
    e.preventDefault();
    const inputs = document.querySelectorAll('.clarify-input');
    const idx = Array.from(inputs).indexOf(e.target);
    if (idx < inputs.length - 1) inputs[idx + 1].focus();
    else submitAnswers();
  }
  if (e.key === 'Escape' && e.target.classList.contains('clarify-input')) { e.preventDefault(); input.focus(); }
});

async function checkBackend() {
  try {
    const res = await fetch(backendUrl + '/api/health', { signal: AbortSignal.timeout(2000) });
    if (res.ok) { statusDot.className = 'status-dot online'; statusBadge.innerHTML = '<span class="status-dot online"></span>ONLINE'; }
    else throw new Error();
  } catch { statusDot.className = 'status-dot offline'; statusBadge.innerHTML = '<span class="status-dot offline"></span>OFFLINE'; }
}
checkBackend();
setInterval(checkBackend, 5000);

let screenPreviewVisible = false;
function toggleScreenPreview() {
  screenPreviewVisible = !screenPreviewVisible;
  const toggle = document.getElementById('screenToggle');
  toggle.style.color = screenPreviewVisible ? 'var(--green)' : '';
  if (window.jarvis?.toggleScreen) window.jarvis.toggleScreen();
}
setTimeout(() => input?.focus(), 100);
</script>
</body>
</html>
