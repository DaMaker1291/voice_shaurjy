<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #030303;
      --surface: #0a0c10;
      --surface2: #111318;
      --border: #1a1d23;
      --green: #00FF66;
      --green-dim: rgba(0,255,102,0.08);
      --green-border: rgba(0,255,102,0.15);
      --text: #e5e5e5;
      --text-muted: #667085;
      --text-dim: #5f6368;
      --red: #FF3B30;
      --yellow: #FFB300;
      --blue: #00B4D8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    /* ── Title Bar ─────────────────────────────────────── */
    .titlebar {
      height: 36px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .titlebar-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(0,255,102,0.5);
    }
    .titlebar-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .titlebar-controls {
      display: flex;
      gap: 2px;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
    }
    .titlebar-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .titlebar-btn.close:hover { background: var(--red); color: white; }

    /* ── Layout ────────────────────────────────────────── */
    .app {
      display: flex;
      height: calc(100vh - 36px);
    }

    /* ── Sidebar ───────────────────────────────────────── */
    .sidebar {
      width: 56px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
    }
    .sidebar-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 18px;
      position: relative;
    }
    .sidebar-btn:hover { background: var(--green-dim); color: var(--text); }
    .sidebar-btn.active {
      background: var(--green-dim);
      color: var(--green);
    }
    .sidebar-btn.active::before {
      content: '';
      position: absolute;
      left: -8px;
      width: 3px; height: 20px;
      background: var(--green);
      border-radius: 0 2px 2px 0;
    }
    .sidebar-spacer { flex: 1; }

    /* ── Main ──────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Chat ──────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message {
      max-width: 700px;
      margin: 0 auto 16px;
      animation: msg-in 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes msg-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .msg-user {
      display: flex;
      justify-content: flex-end;
    }
    .msg-user .msg-bubble {
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      color: var(--text);
      border-radius: 12px 12px 2px 12px;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    .msg-jarvis {
      display: flex;
      gap: 10px;
    }
    .msg-jarvis .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-jarvis .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px 12px 12px 12px;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }
    .msg-bubble code {
      background: rgba(0,255,102,0.08);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 12px;
      color: var(--green);
    }
    .msg-time {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 4px;
      padding-left: 38px;
    }

    /* ── Input ─────────────────────────────────────────── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-wrapper {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .input-box {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: var(--green-border); }
    .input-box::placeholder { color: var(--text-dim); }
    .send-btn {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--green);
      color: #030303;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(0,255,102,0.3); }
    .send-btn:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }

    /* ── Status Bar ────────────────────────────────────── */
    .statusbar {
      height: 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 10px;
      color: var(--text-dim);
      gap: 16px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .status-online { background: var(--green); box-shadow: 0 0 6px rgba(0,255,102,0.5); }
    .status-offline { background: var(--red); }

    /* ── Welcome Screen ────────────────────────────────── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px;
    }
    .welcome-orb {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,102,0.12) 0%, transparent 70%);
      border: 1px solid var(--green-border);
      display: flex; align-items: center; justify-content: center;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .welcome-orb-inner {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 20px rgba(0,255,102,0.4);
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow { 0%,100% { box-shadow: 0 0 20px rgba(0,255,102,0.4); } 50% { box-shadow: 0 0 40px rgba(0,255,102,0.6); } }
    .welcome h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome p {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      max-width: 400px;
      line-height: 1.7;
    }
    .welcome-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .welcome-chip {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 10px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    /* ── Device Panel ──────────────────────────────────── */
    .panel {
      width: 300px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .device-card {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .device-card:hover { border-color: var(--green-border); }
    .device-name { font-size: 11px; font-weight: 500; }
    .device-ip { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
    .device-status {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      float: right;
      margin-top: 4px;
    }

    /* ── Typing indicator ──────────────────────────────── */
    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 16px;
    }
    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── API ──────────────────────────────────────────────
    const API = window.jarvis ? "http://127.0.0.1:8765" : "";

    async function api(path, opts = {}) {
      try {
        const res = await fetch(`${API}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        return await res.json();
      } catch (e) {
        console.error("API error:", e);
        return null;
      }
    }

    // ── IPC Bridge ───────────────────────────────────────
    const j = window.jarvis;

    // ── App ──────────────────────────────────────────────
    function App() {
      const [view, setView] = useState("chat");
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [sending, setSending] = useState(false);
      const [backend, setBackend] = useState(false);
      const [devices, setDevices] = useState([]);
      const chatRef = useRef(null);

      // Check backend
      useEffect(() => {
        const check = async () => {
          const res = await api("/api/health");
          setBackend(!!res);
        };
        check();
        const i = setInterval(check, 5000);
        return () => clearInterval(i);
      }, []);

      // Load devices
      useEffect(() => {
        const load = async () => {
          const res = await api("/api/relay/devices?user_id=local");
          if (res?.devices) setDevices(res.devices);
        };
        load();
        const i = setInterval(load, 15000);
        return () => clearInterval(i);
      }, []);

      // Scroll to bottom
      useEffect(() => {
        if (chatRef.current) {
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }
      }, [messages]);

      // Send message
      const send = useCallback(async () => {
        const text = input.trim();
        if (!text || sending) return;

        const userMsg = { role: "user", text, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
        setMessages((m) => [...m, userMsg]);
        setInput("");
        setSending(true);

        try {
          const res = await api("/api/chat", {
            method: "POST",
            body: JSON.stringify({ message: text, user_id: "local" }),
          });

          const jarvisMsg = {
            role: "jarvis",
            text: res?.response || res?.reply || "I couldn't process that request.",
            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          };
          setMessages((m) => [...m, jarvisMsg]);

          // Native notification
          if (j && jarvisMsg.text.length > 0) {
            j.notify("JARVIS", jarvisMsg.text.slice(0, 200));
          }
        } catch {
          setMessages((m) => [...m, {
            role: "jarvis",
            text: "Connection lost. Is the backend running?",
            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          }]);
        }
        setSending(false);
      }, [input, sending]);

      const handleKey = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };

      return (
        <React.Fragment>
          {/* Title Bar */}
          <div className="titlebar">
            <div className="titlebar-left">
              <div className="titlebar-dot" />
              <span className="titlebar-title">JARVIS</span>
            </div>
            <div className="titlebar-controls">
              <button className="titlebar-btn" onClick={() => j?.window.minimize()}>─</button>
              <button className="titlebar-btn" onClick={() => j?.window.maximize()}>□</button>
              <button className="titlebar-btn close" onClick={() => j?.window.close()}>✕</button>
            </div>
          </div>

          <div className="app">
            {/* Sidebar */}
            <div className="sidebar">
              <button className={`sidebar-btn ${view === "chat" ? "active" : ""}`} onClick={() => setView("chat")} title="Chat">💬</button>
              <button className={`sidebar-btn ${view === "devices" ? "active" : ""}`} onClick={() => setView("devices")} title="Devices">📡</button>
              <button className={`sidebar-btn ${view === "agents" ? "active" : ""}`} onClick={() => setView("agents")} title="Agents">🤖</button>
              <button className={`sidebar-btn ${view === "settings" ? "active" : ""}`} onClick={() => setView("settings")} title="Settings">⚙️</button>
              <div className="sidebar-spacer" />
              <button className="sidebar-btn" onClick={() => j?.shell.openExternal("https://dgfhgjhj-jarvis-ai-brain.hf.space")} title="Open Web UI">🌐</button>
            </div>

            {/* Main Content */}
            <div className="main">
              {view === "chat" && (
                <React.Fragment>
                  <div className="chat-container" ref={chatRef}>
                    {messages.length === 0 ? (
                      <div className="welcome">
                        <div className="welcome-orb">
                          <div className="welcome-orb-inner" />
                        </div>
                        <h1>JARVIS</h1>
                        <p>Your sovereign AI brain. I control your devices, automate your tasks, and own my intelligence. No cloud dependency.</p>
                        <div className="welcome-chips">
                          <span className="welcome-chip">Real Device Control</span>
                          <span className="welcome-chip">Autonomous Agents</span>
                          <span className="welcome-chip">Desktop Native</span>
                        </div>
                      </div>
                    ) : (
                      messages.map((msg, i) => (
                        <div key={i} className={`message ${msg.role === "user" ? "msg-user" : "msg-jarvis"}`}>
                          {msg.role === "jarvis" && <div className="msg-avatar">J</div>}
                          <div>
                            <div className="msg-bubble">{msg.text}</div>
                            <div className="msg-time">{msg.time}</div>
                          </div>
                        </div>
                      ))
                    )}
                    {sending && (
                      <div className="message msg-jarvis">
                        <div className="msg-avatar">J</div>
                        <div className="msg-bubble">
                          <div className="typing">
                            <div className="typing-dot" />
                            <div className="typing-dot" />
                            <div className="typing-dot" />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="input-area">
                    <div className="input-wrapper">
                      <textarea
                        className="input-box"
                        placeholder="Ask JARVIS anything..."
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                        onKeyDown={handleKey}
                        rows={1}
                        disabled={sending}
                      />
                      <button className="send-btn" onClick={send} disabled={!input.trim() || sending}>
                        ▶
                      </button>
                    </div>
                  </div>
                </React.Fragment>
              )}

              {view === "devices" && (
                <div style={{ flex: 1, overflow: "auto", padding: 20 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 16 }}>Devices ({devices.length})</div>
                  {devices.length === 0 ? (
                    <div style={{ textAlign: "center", padding: 40, color: "var(--text-muted)" }}>
                      <div style={{ fontSize: 32, marginBottom: 12 }}>📡</div>
                      <div style={{ fontSize: 12 }}>No devices discovered yet.</div>
                      <div style={{ fontSize: 10, marginTop: 4 }}>Run a network scan from chat.</div>
                    </div>
                  ) : (
                    devices.map((d, i) => (
                      <div key={i} className="device-card">
                        <div className="device-status" />
                        <div className="device-name">{d.name || d.type || "Unknown Device"}</div>
                        <div className="device-ip">{d.ip}</div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {view === "settings" && (
                <div style={{ flex: 1, overflow: "auto", padding: 20, maxWidth: 500 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 16 }}>Settings</div>

                  <div style={{ padding: "12px 16px", borderRadius: 8, background: "var(--bg)", border: "1px solid var(--border)", marginBottom: 8 }}>
                    <div style={{ fontSize: 11, fontWeight: 500, marginBottom: 4 }}>Backend Status</div>
                    <div style={{ fontSize: 10, color: backend ? "var(--green)" : "var(--red)" }}>
                      {backend ? "● Online" : "○ Offline"}
                    </div>
                  </div>

                  <div style={{ padding: "12px 16px", borderRadius: 8, background: "var(--bg)", border: "1px solid var(--border)", marginBottom: 8 }}>
                    <div style={{ fontSize: 11, fontWeight: 500, marginBottom: 4 }}>Auto-Launch on Startup</div>
                    <AutoLaunchToggle />
                  </div>

                  <div style={{ padding: "12px 16px", borderRadius: 8, background: "var(--bg)", border: "1px solid var(--border)", marginBottom: 8 }}>
                    <div style={{ fontSize: 11, fontWeight: 500, marginBottom: 4 }}>Restart Backend</div>
                    <button
                      onClick={() => j?.backend.restart()}
                      style={{
                        padding: "6px 16px", borderRadius: 6, fontSize: 10,
                        background: "var(--green-dim)", color: "var(--green)",
                        border: "1px solid var(--green-border)", cursor: "pointer",
                        fontFamily: "inherit",
                      }}
                    >
                      Restart
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Device Panel (chat view only) */}
            {view === "chat" && devices.length > 0 && (
              <div className="panel">
                <div className="panel-header">
                  <span>DEVICES ({devices.length})</span>
                </div>
                <div className="panel-content">
                  {devices.map((d, i) => (
                    <div key={i} className="device-card">
                      <div className="device-status" />
                      <div className="device-name">{d.name || d.type || "Unknown"}</div>
                      <div className="device-ip">{d.ip}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Status Bar */}
          <div className="statusbar">
            <div style={{ display: "flex", alignItems: "center" }}>
              <div className={`status-dot ${backend ? "status-online" : "status-offline"}`} />
              {backend ? "Backend Online" : "Backend Offline"}
            </div>
            <div>{devices.length} devices</div>
            <div style={{ flex: 1 }} />
            <div>JARVIS v3.0</div>
          </div>
        </React.Fragment>
      );
    }

    function AutoLaunchToggle() {
      const [enabled, setEnabled] = useState(false);
      const j = window.jarvis;

      useEffect(() => {
        j?.autoLaunch.get().then(setEnabled);
      }, []);

      const toggle = async () => {
        const next = !enabled;
        await j?.autoLaunch.set(next);
        setEnabled(next);
      };

      return (
        <button
          onClick={toggle}
          style={{
            padding: "6px 16px", borderRadius: 6, fontSize: 10,
            background: enabled ? "var(--green)" : "var(--green-dim)",
            color: enabled ? "#030303" : "var(--green)",
            border: `1px solid ${enabled ? "var(--green)" : "var(--green-border)"}`,
            cursor: "pointer",
            fontFamily: "inherit",
          }}
        >
          {enabled ? "Enabled" : "Enable"}
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
