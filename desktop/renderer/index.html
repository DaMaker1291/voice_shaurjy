<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #030303;
      --surface: #0a0c10;
      --surface2: #111318;
      --border: #1a1d23;
      --green: #00FF66;
      --green-dim: rgba(0,255,102,0.08);
      --green-border: rgba(0,255,102,0.15);
      --text: #e5e5e5;
      --text-muted: #667085;
      --text-dim: #5f6368;
      --red: #FF3B30;
      --yellow: #FFB300;
      --blue: #00B4D8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    .titlebar {
      height: 36px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .titlebar-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(0,255,102,0.5);
    }
    .titlebar-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .titlebar-controls {
      display: flex;
      gap: 2px;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
    }
    .titlebar-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .titlebar-btn.close:hover { background: var(--red); color: white; }

    .app {
      display: flex;
      height: calc(100vh - 36px);
    }

    .sidebar {
      width: 56px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
    }
    .sidebar-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 18px;
      position: relative;
    }
    .sidebar-btn:hover { background: var(--green-dim); color: var(--text); }
    .sidebar-btn.active {
      background: var(--green-dim);
      color: var(--green);
    }
    .sidebar-btn.active::before {
      content: '';
      position: absolute;
      left: -8px;
      width: 3px; height: 20px;
      background: var(--green);
      border-radius: 0 2px 2px 0;
    }
    .sidebar-spacer { flex: 1; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message {
      max-width: 700px;
      margin: 0 auto 16px;
      animation: msg-in 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes msg-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user .msg-bubble {
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      color: var(--text);
      border-radius: 12px 12px 2px 12px;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    .msg-jarvis { display: flex; gap: 10px; }
    .msg-jarvis .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-jarvis .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px 12px 12px 12px;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }
    .msg-bubble code {
      background: rgba(0,255,102,0.08);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: var(--green);
    }
    .msg-time {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 4px;
      padding-left: 38px;
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-wrapper {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .input-box {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: var(--green-border); }
    .input-box::placeholder { color: var(--text-dim); }
    .send-btn {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--green);
      color: #030303;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(0,255,102,0.3); }
    .send-btn:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }

    .statusbar {
      height: 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 10px;
      color: var(--text-dim);
      gap: 16px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .status-online { background: var(--green); box-shadow: 0 0 6px rgba(0,255,102,0.5); }
    .status-offline { background: var(--red); }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px;
    }
    .welcome-orb {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,102,0.12) 0%, transparent 70%);
      border: 1px solid var(--green-border);
      display: flex; align-items: center; justify-content: center;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .welcome-orb-inner {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 20px rgba(0,255,102,0.4);
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow { 0%,100% { box-shadow: 0 0 20px rgba(0,255,102,0.4); } 50% { box-shadow: 0 0 40px rgba(0,255,102,0.6); } }
    .welcome h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome p {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      max-width: 400px;
      line-height: 1.7;
    }
    .welcome-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .welcome-chip {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 10px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    .device-card {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .device-card:hover { border-color: var(--green-border); }
    .device-name { font-size: 11px; font-weight: 500; }
    .device-ip { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
    .device-status {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      float: right;
      margin-top: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 16px;
    }
    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }

    .settings-card {
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .settings-label { font-size: 11px; font-weight: 500; margin-bottom: 4px; }
    .settings-value { font-size: 10px; }
    .settings-btn {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 10px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--green-border);
      cursor: pointer;
      font-family: inherit;
    }
    .settings-btn:hover { background: rgba(0,255,102,0.15); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // ── No CDN needed — pure vanilla JS ──────────────────────────────
    const API = window.jarvis ? "http://127.0.0.1:8765" : "";
    const j = window.jarvis;

    async function api(path, opts = {}) {
      try {
        const res = await fetch(API + path, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        if (!res.ok) {
          let text = "";
          try { text = await res.text(); } catch {}
          console.error("API error:", res.status, text.slice(0, 200));
          return null;
        }
        const text = await res.text();
        if (!text) return {};
        try { return JSON.parse(text); } catch {
          console.error("Invalid JSON:", text.slice(0, 200));
          return null;
        }
      } catch (e) {
        console.error("API error:", e);
        return null;
      }
    }

    // ── State ──────────────────────────────────────────────────────
    let state = {
      view: "chat",
      messages: [],
      input: "",
      sending: false,
      backend: false,
      devices: [],
      autoLaunch: false,
    };

    const root = document.getElementById("root");

    function render() {
      root.innerHTML = "";
      root.appendChild(buildApp());
    }

    function buildApp() {
      const frag = document.createDocumentFragment();

      // Title Bar
      frag.appendChild(buildTitleBar());

      const appDiv = el("div", "app");

      // Sidebar
      appDiv.appendChild(buildSidebar());

      // Main
      const mainDiv = el("div", "main");

      if (state.view === "chat") {
        mainDiv.appendChild(buildChat());
      } else if (state.view === "devices") {
        mainDiv.appendChild(buildDevices());
      } else if (state.view === "settings") {
        mainDiv.appendChild(buildSettings());
      }

      appDiv.appendChild(mainDiv);
      frag.appendChild(appDiv);

      // Status Bar
      frag.appendChild(buildStatusBar());

      return frag;
    }

    function el(tag, className) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      return e;
    }

    function buildTitleBar() {
      const bar = el("div", "titlebar");
      const left = el("div", "titlebar-left");
      left.innerHTML = '<div class="titlebar-dot"></div><span class="titlebar-title">JARVIS</span>';

      const controls = el("div", "titlebar-controls");
      const minBtn = el("button", "titlebar-btn");
      minBtn.textContent = "\u2500";
      minBtn.onclick = () => j?.window.minimize();
      const maxBtn = el("button", "titlebar-btn");
      maxBtn.textContent = "\u25A1";
      maxBtn.onclick = () => j?.window.maximize();
      const closeBtn = el("button", "titlebar-btn close");
      closeBtn.textContent = "\u2715";
      closeBtn.onclick = () => j?.window.close();
      controls.append(minBtn, maxBtn, closeBtn);

      bar.append(left, controls);
      return bar;
    }

    function buildSidebar() {
      const sb = el("div", "sidebar");
      const items = [
        { id: "chat", icon: "\uD83D\uDCAC", title: "Chat" },
        { id: "devices", icon: "\uD83D\uDCE1", title: "Devices" },
        { id: "settings", icon: "\u2699\uFE0F", title: "Settings" },
      ];
      items.forEach((item) => {
        const btn = el("button", "sidebar-btn" + (state.view === item.id ? " active" : ""));
        btn.textContent = item.icon;
        btn.title = item.title;
        btn.onclick = () => { state.view = item.id; render(); };
        sb.appendChild(btn);
      });
      const spacer = el("div", "sidebar-spacer");
      sb.appendChild(spacer);
      const webBtn = el("button", "sidebar-btn");
      webBtn.textContent = "\uD83C\uDF10";
      webBtn.title = "Open Web UI";
      webBtn.onclick = () => j?.shell.openExternal("https://dgfhgjhj-jarvis-ai-brain.hf.space");
      sb.appendChild(webBtn);
      return sb;
    }

    function buildChat() {
      const frag = document.createDocumentFragment();
      const chatContainer = el("div", "chat-container");

      if (state.messages.length === 0) {
        const welcome = el("div", "welcome");
        welcome.innerHTML =
          '<div class="welcome-orb"><div class="welcome-orb-inner"></div></div>' +
          '<h1>JARVIS</h1>' +
          '<p>Your sovereign AI brain. I control your devices, automate your tasks, and own my intelligence.</p>' +
          '<div class="welcome-chips">' +
          '<span class="welcome-chip">Real Device Control</span>' +
          '<span class="welcome-chip">Autonomous Agents</span>' +
          '<span class="welcome-chip">Desktop Native</span>' +
          '</div>';
        chatContainer.appendChild(welcome);
      } else {
        state.messages.forEach((msg) => {
          const msgDiv = el("div", "message " + (msg.role === "user" ? "msg-user" : "msg-jarvis"));
          if (msg.role === "jarvis") {
            const avatar = el("div", "msg-avatar");
            avatar.textContent = "J";
            msgDiv.appendChild(avatar);
          }
          const content = el("div");
          const bubble = el("div", "msg-bubble");
          bubble.textContent = msg.text;
          content.appendChild(bubble);
          const time = el("div", "msg-time");
          time.textContent = msg.time;
          content.appendChild(time);
          msgDiv.appendChild(content);
          chatContainer.appendChild(msgDiv);
        });
      }

      if (state.sending) {
        const typingDiv = el("div", "message msg-jarvis");
        typingDiv.innerHTML =
          '<div class="msg-avatar">J</div>' +
          '<div class="msg-bubble"><div class="typing">' +
          '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
          '</div></div>';
        chatContainer.appendChild(typingDiv);
      }

      frag.appendChild(chatContainer);

      // Input area
      const inputArea = el("div", "input-area");
      const wrapper = el("div", "input-wrapper");
      const textarea = document.createElement("textarea");
      textarea.className = "input-box";
      textarea.placeholder = "Ask JARVIS anything...";
      textarea.value = state.input;
      textarea.rows = 1;
      textarea.disabled = state.sending;
      textarea.oninput = (e) => { state.input = e.target.value; };
      textarea.onkeydown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };
      const sendBtn = el("button", "send-btn");
      sendBtn.textContent = "\u25B6";
      sendBtn.disabled = !state.input.trim() || state.sending;
      sendBtn.onclick = () => sendMessage();
      wrapper.append(textarea, sendBtn);
      inputArea.appendChild(wrapper);
      frag.appendChild(inputArea);

      return frag;
    }

    function buildDevices() {
      const div = el("div");
      div.style.cssText = "flex:1;overflow:auto;padding:20px";
      div.innerHTML = '<div style="font-size:14px;font-weight:600;margin-bottom:16px">Devices (' + state.devices.length + ')</div>';
      if (state.devices.length === 0) {
        div.innerHTML += '<div style="text-align:center;padding:40px;color:var(--text-muted)">' +
          '<div style="font-size:32px;margin-bottom:12px">\uD83D\uDCE1</div>' +
          '<div style="font-size:12px">No devices discovered yet.</div></div>';
      } else {
        state.devices.forEach((d) => {
          const card = el("div", "device-card");
          card.innerHTML = '<div class="device-status"></div>' +
            '<div class="device-name">' + (d.name || d.type || "Unknown") + '</div>' +
            '<div class="device-ip">' + d.ip + '</div>';
          div.appendChild(card);
        });
      }
      return div;
    }

    function buildSettings() {
      const div = el("div");
      div.style.cssText = "flex:1;overflow:auto;padding:20px;max-width:500px";
      div.innerHTML = '<div style="font-size:14px;font-weight:600;margin-bottom:16px">Settings</div>';

      const statusCard = el("div", "settings-card");
      statusCard.innerHTML = '<div class="settings-label">Backend Status</div>' +
        '<div class="settings-value" style="color:' + (state.backend ? "var(--green)" : "var(--red)") + '">' +
        (state.backend ? "\u25CF Online" : "\u25CB Offline") + '</div>';
      div.appendChild(statusCard);

      const launchCard = el("div", "settings-card");
      launchCard.innerHTML = '<div class="settings-label">Auto-Launch on Startup</div>';
      const launchBtn = el("button", "settings-btn");
      launchBtn.textContent = state.autoLaunch ? "Enabled" : "Enable";
      launchBtn.style.background = state.autoLaunch ? "var(--green)" : "";
      launchBtn.style.color = state.autoLaunch ? "#030303" : "";
      launchBtn.onclick = async () => {
        state.autoLaunch = !state.autoLaunch;
        await j?.autoLaunch.set(state.autoLaunch);
        render();
      };
      launchCard.appendChild(launchBtn);
      div.appendChild(launchCard);

      const restartCard = el("div", "settings-card");
      restartCard.innerHTML = '<div class="settings-label">Restart Backend</div>';
      const restartBtn = el("button", "settings-btn");
      restartBtn.textContent = "Restart";
      restartBtn.onclick = () => j?.backend.restart();
      restartCard.appendChild(restartBtn);
      div.appendChild(restartCard);

      return div;
    }

    function buildStatusBar() {
      const bar = el("div", "statusbar");
      const status = el("div");
      status.style.display = "flex";
      status.style.alignItems = "center";
      status.innerHTML = '<div class="status-dot ' + (state.backend ? "status-online" : "status-offline") + '"></div>' +
        (state.backend ? "Backend Online" : "Backend Offline");
      bar.appendChild(status);
      const devCount = el("div");
      devCount.textContent = state.devices.length + " devices";
      bar.appendChild(devCount);
      const spacer = el("div");
      spacer.style.flex = "1";
      bar.appendChild(spacer);
      const version = el("div");
      version.textContent = "JARVIS v3.0";
      bar.appendChild(version);
      return bar;
    }

    async function sendMessage() {
      const text = state.input.trim();
      if (!text || state.sending) return;

      const userMsg = {
        role: "user",
        text: text,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      };
      state.messages.push(userMsg);
      state.input = "";
      state.sending = true;
      render();

      try {
        const res = await api("/api/chat", {
          method: "POST",
          body: JSON.stringify({ message: text, user_id: "local" }),
        });
        const jarvisMsg = {
          role: "jarvis",
          text: res?.response || res?.reply || "I couldn't process that request.",
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        };
        state.messages.push(jarvisMsg);
        if (j && jarvisMsg.text.length > 0) {
          j.notify("JARVIS", jarvisMsg.text.slice(0, 200));
        }
      } catch {
        state.messages.push({
          role: "jarvis",
          text: "Connection lost. Is the backend running?",
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        });
      }
      state.sending = false;
      render();
    }

    // ── Polling ────────────────────────────────────────────────────
    async function checkBackend() {
      const res = await api("/api/health");
      const next = !!res;
      if (next !== state.backend) {
        state.backend = next;
        render();
      }
    }

    async function loadDevices() {
      const res = await api("/api/relay/devices?user_id=local");
      if (res?.devices) {
        state.devices = res.devices;
        render();
      }
    }

    async function loadAutoLaunch() {
      if (j) {
        const val = await j.autoLaunch.get();
        state.autoLaunch = val;
      }
    }

    // ── Init ───────────────────────────────────────────────────────
    render();
    loadAutoLaunch();
    checkBackend();
    loadDevices();
    setInterval(checkBackend, 5000);
    setInterval(loadDevices, 15000);
  </script>
</body>
</html>
